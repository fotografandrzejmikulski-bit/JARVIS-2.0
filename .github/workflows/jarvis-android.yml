name: JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-2-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is missing."
            exit 1
          fi
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm install
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Initialize or link EAS project
        run: |
          ACCOUNT=$(eas whoami)
          if [ -z "$ACCOUNT" ]; then
            echo "Unable to determine Expo account from EXPO_TOKEN."
            exit 1
          fi
          eas init --account "$ACCOUNT" --non-interactive
      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive --no-wait
